name: build

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a broken nixpkgs bump surfaces here and not during a switch.
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds the laptop activation package (evaluating every module and
      # shellchecking every helper script) and runs the treefmt check. The
      # macOS checks are scoped to aarch64-darwin and skipped here.
      - run: nix flake check --print-build-logs

      - run: nix run .#lint

      # Formatting is enforced by applying it and failing if anything changed,
      # which needs no second copy of the formatter config.
      - run: nix fmt
      - run: git diff --exit-code
